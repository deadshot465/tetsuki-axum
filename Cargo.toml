[package]
name = "tetsuki-axum"
version = "3.2.3"
authors = ["Chehui Chou <deadshot465@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "~1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
azure_core = "1.1.0"
azure_data_cosmos = { version = "0.38.0", features = ["key_auth"] }
bollard = { version = "0.21.1", features = ["time", "json_data_content"] }
convert_case = "0.12.0"
dashmap = "6.0.1"
dotenv = "~0.15.0"
futures = "~0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
once_cell = "1.21.4"
rand = "~0.10.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = "~1.0.229"
serde_json = "~1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "json", "tls-rustls", "sqlite"] }
thirtyfour = "0.37.5"
time = { version = "~0.3.11", features = ["serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["full", "process"] }
toml = ">=0.7.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "*"

[profile.dev]
split-debuginfo = "unpacked"
